name: Build wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "src/c/**"
      - "pyproject.toml"
      - ".github/workflows/wheels.yml"

# Cancel an in-progress run when a newer commit is pushed to the same ref,
# so superseded (slow, emulated) builds don't keep burning CI minutes.
concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # TEMP: Windows validation run. The Linux + sdist jobs are disabled below
  # (if: false) for fast turnaround; re-enable them once Windows is confirmed.
  build_windows:
    name: windows ${{ matrix.archs }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - archs: AMD64
    steps:
      - uses: actions/checkout@v4
      - name: Install ninja
        run: choco install ninja --no-progress
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.archs }}
          path: ./wheelhouse/*.whl

  build_wheels:
    if: ${{ false }}  # TEMP: disabled for the macOS validation run
    name: linux ${{ matrix.archs }} / ${{ matrix.mltag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build the two most-recent manylinux baselines per arch:
          # manylinux_2_34 (AlmaLinux 9) and manylinux_2_28 (AlmaLinux 8). Full
          # quay.io image paths are used because the short "manylinux_2_34"
          # alias is not recognized by cibuildwheel 2.21.x. aarch64 builds run
          # under QEMU emulation.
          #
          # macOS and Windows are intentionally omitted for now: the vendored
          # kissat fork does not yet compile under AppleClang (implicit
          # memset/string.h) or MSVC (GCC/Clang-only compile flags). Those are
          # C-portability fixes, separate from packaging.
          - archs: x86_64
            mltag: "2_34"
            image: quay.io/pypa/manylinux_2_34_x86_64
          - archs: x86_64
            mltag: "2_28"
            image: quay.io/pypa/manylinux_2_28_x86_64
          - archs: aarch64
            mltag: "2_34"
            image: quay.io/pypa/manylinux_2_34_aarch64
          - archs: aarch64
            mltag: "2_28"
            image: quay.io/pypa/manylinux_2_28_aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (emulated arches)
        if: matrix.archs != 'x86_64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      # cibuildwheel >= 3.0 dropped EOL CPython 3.8, which the manylinux_2_34
      # image no longer ships; older releases crash probing it. Bump as needed.
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.image }}
          CIBW_MANYLINUX_AARCH64_IMAGE: ${{ matrix.image }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.archs }}-${{ matrix.mltag }}
          path: ./wheelhouse/*.whl

  build_sdist:
    if: ${{ false }}  # TEMP: disabled for the macOS validation run
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ./dist/*.tar.gz
