# TEMPORARY: fast iteration on the MSVC + CaDiCaL build (feat/windows-cadical).
# Windows only, so a push gets an answer in minutes rather than waiting on the
# full wheel matrix. Publishes nothing. Remove before merging.
name: Windows dev

on:
  push:
    branches: ["feat/windows-cadical"]
  workflow_dispatch:

jobs:
  msvc:
    # cadical OFF is the pre-existing Windows build: the baseline that tells a
    # CaDiCaL problem from one Windows already had.
    strategy:
      fail-fast: false
      matrix:
        cadical: ["ON", "OFF"]
    name: msvc-cadical-${{ matrix.cadical }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ninja
        run: choco install ninja --no-progress

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Fetch CaDiCaL sources
        run: pipx run ivpm update -d use -a --py-skip-install

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=build -DDVS_WITH_CADICAL=${{ matrix.cadical }}

      - name: Build
        # -k 0: report every failing translation unit, not just the first.
        run: cmake --build build -- -k 0

      - name: Install
        run: cmake --install build

      - name: Dependencies of the DLLs
        run: |
          dumpbin /nologo /dependents build/lib/dv_solve.dll
          dumpbin /nologo /dependents build/lib/dv_solve_dpi.dll

      - name: dv-solve-smt2
        shell: bash
        run: |
          exe=build/bin/dv-solve-smt2.exe
          dumpbin //nologo //dependents $exe | tee deps.txt
          if grep -iE "vcruntime|msvcp|ucrtbase|api-ms-win-crt" deps.txt; then
            echo "::error::dv-solve-smt2.exe needs the DLL C runtime"; exit 1
          fi
          $exe --version
          cd docs/examples/smt2
          ../../../$exe quickstart.smt2 > out.txt
          diff quickstart.expected out.txt

      - name: CaDiCaL backend C test
        if: matrix.cadical == 'ON'
        shell: cmd
        run: |
          cl /nologo /O2 /Isrc\c /FI"%CD%\src\c\compat\win\msvc_compat.h" /Isrc\c\compat\win tests\c\test_dvs_sat_cadical.c build\dv_solve.lib /Fe:build\test_dvs_sat_cadical.exe
          set PATH=%CD%\build\lib;%CD%\build;%PATH%
          build\test_dvs_sat_cadical.exe

      - name: Python unit tests
        if: always()
        env:
          PYTHONPATH: src
        run: |
          python -m pip install -q pytest
          python -m pytest tests/unit -q -p no:cacheprovider --continue-on-collection-errors -rfE --tb=line

  wheel:
    # The windows-AMD64 job of wheels.yml, alone.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ninja
        run: choco install ninja --no-progress
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Fetch CaDiCaL sources
        run: pipx run ivpm update -d use -a --py-skip-install
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_ARCHS: AMD64
      - name: Wheel contents
        shell: bash
        run: python -c "import sys,zipfile; [print(n) for n in zipfile.ZipFile(sys.argv[1]).namelist() if not n.startswith('dv_solve/share/')]" wheelhouse/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-dev
          path: ./wheelhouse/*.whl

  asan:
    # MSVC AddressSanitizer on the kissat-only build: reports the first bad
    # access behind the crashes in propagation, not where they end up.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ninja
        run: choco install ninja --no-progress
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build (ASan, kissat only)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=build -DDVS_WITH_CADICAL=OFF "-DCMAKE_C_FLAGS=/fsanitize=address /Zi" "-DCMAKE_CXX_FLAGS=/fsanitize=address /Zi" "-DCMAKE_SHARED_LINKER_FLAGS=/DEBUG /INCREMENTAL:NO" "-DCMAKE_EXE_LINKER_FLAGS=/DEBUG /INCREMENTAL:NO"
          cmake --build build
          cmake --install build
      - name: C tests under ASan
        shell: cmd
        run: |
          for /f "delims=" %%d in ('where cl') do set CLDIR=%%~dpd
          set PATH=%CD%\build\lib;%CD%\build;%CLDIR%;%PATH%
          set FI=/FI"%CD%\src\c\compat\win\msvc_compat.h" /Isrc\c\compat\win
          set RC=0
          for %%t in (test_dvs_sat test_dvs_aig test_dvs_aig_cnf test_dvs_bitblast test_dvs_bbsolver test_dvs_bvdom test_dvs_wide_arith test_dvs_arena) do (
            echo ===== %%t
            cl /nologo /O1 /Zi /fsanitize=address /Isrc\c /Isrc\c\sat\kissat\src %FI% tests\c\%%t.c build\dv_solve.lib /Fe:build\%%t.exe /link /INCREMENTAL:NO >nul || (echo compile failed: %%t & set RC=1)
            if exist build\%%t.exe build\%%t.exe > build\%%t.out 2>&1 || (echo FAILED: %%t & set RC=1)
            if exist build\%%t.out powershell -Command "Get-Content build\%%t.out -TotalCount 120"
          )
          exit /b %RC%
