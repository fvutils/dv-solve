# Windows (MSVC) build and tests. wheels.yml builds and smoke-tests the
# Windows wheel, but only on tags and for build-file changes; this runs the
# unit suite against an MSVC build on every push to main and every PR, so a
# Windows-only regression in the solver shows up before a release does.
#
# GitHub only: the Forgejo runner has no Windows. Builds and tests, publishes
# nothing.
name: Windows

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msvc:
    name: msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ninja
        run: choco install ninja --no-progress

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Fetch CaDiCaL sources
        run: pipx run ivpm update -d use -a --py-skip-install

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=build

      - name: Build
        run: cmake --build build

      - name: Install
        run: cmake --install build

      - name: CaDiCaL backend C test
        shell: cmd
        run: |
          cl /nologo /O2 /Isrc\c /FI"%CD%\src\c\compat\win\msvc_compat.h" /Isrc\c\compat\win tests\c\test_dvs_sat_cadical.c build\dv_solve.lib /Fe:build\test_dvs_sat_cadical.exe
          set PATH=%CD%\build\lib;%CD%\build;%PATH%
          build\test_dvs_sat_cadical.exe

      - name: dv-solve-smt2
        shell: bash
        run: |
          exe=build/bin/dv-solve-smt2.exe
          # Shipped in pip's Scripts\, where no VC runtime DLL sits beside it:
          # it must be on the static runtime (CMakeLists.txt).
          dumpbin //nologo //dependents $exe | tee deps.txt
          if grep -iE "vcruntime|msvcp|ucrtbase|api-ms-win-crt" deps.txt; then
            echo "::error::dv-solve-smt2.exe needs the DLL C runtime"; exit 1
          fi
          $exe --version
          cd docs/examples/smt2
          ../../../$exe quickstart.smt2 > out.txt
          # The checkout has CRLF line ends; the tool writes LF.
          diff --strip-trailing-cr quickstart.expected out.txt

      - name: Python unit tests
        env:
          PYTHONPATH: src
        run: |
          python -m pip install -q pytest
          # scipy and zuspec (fetched by a full ivpm update) are not installed here.
          python -m pytest tests/unit -q -p no:cacheprovider -rfE --tb=short --ignore=tests/unit/test_dist_quality.py --ignore=tests/unit/test_e2e.py --ignore=tests/unit/test_partitioner.py
