# Simbench configurations: simulator + solver + sampler.
# Values may use ~ and ${VAR} / ${VAR:-default}. Extra configs can be added
# from a local file named by SIMBENCH_CONFIGS (same format; same id overrides).
#
# Fields:
#   simulator: verilator (only one supported so far)
#   tool:      simulator executable (path, or a name looked up on PATH)
#   solver:    command line put in VERILATOR_SOLVER (its first word must exist)
#   sampler:   default | solver | null (null: no sampler plusarg; stock Verilator)
#   plusargs:  extra plusargs for every run
#   env:       extra environment for every run
configs:
  # Primary (A): dev Verilator, z3 via SMT-LIB pipe, Verilator's own sampler.
  - id: vlt-z3-default
    simulator: verilator
    tool: ${SIMBENCH_VERILATOR_SC:-~/projects/verilator/verilator-sampler-control/bin/verilator}
    solver: z3 --in
    sampler: default

  # Primary (B): dev Verilator, dv-solve-smt2, dv-solve does the sampling.
  - id: vlt-dvs-solver
    simulator: verilator
    tool: ${SIMBENCH_VERILATOR_SC:-~/projects/verilator/verilator-sampler-control/bin/verilator}
    solver: ${SIMBENCH_DVS_SMT2:-~/projects/verilator/verilator-sampler-control/dv-solve/build/dv-solve-smt2}
    sampler: solver

  # Secondary: dev Verilator, dv-solve-smt2 as a plain SMT solver, Verilator sampler.
  - id: vlt-dvs-default
    simulator: verilator
    tool: ${SIMBENCH_VERILATOR_SC:-~/projects/verilator/verilator-sampler-control/bin/verilator}
    solver: ${SIMBENCH_DVS_SMT2:-~/projects/verilator/verilator-sampler-control/dv-solve/build/dv-solve-smt2}
    sampler: default

  # Secondary: stock Verilator on PATH with z3 (no sampler control).
  - id: vlt540-z3
    simulator: verilator
    tool: ${SIMBENCH_VERILATOR:-verilator}
    solver: z3 --in
    sampler: null
