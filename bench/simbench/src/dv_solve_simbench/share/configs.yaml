# Simbench configurations: simulator + solver + sampler.
# Values may use ~ and ${VAR} / ${VAR:-default}. Extra configs can be added
# from a local file named by SIMBENCH_CONFIGS (same format; same id overrides).
#
# Fields:
#   simulator: verilator | vcs | xcelium | questa
#   tool:      simulator executable (path, or a name looked up on PATH):
#              verilator, vcs, xrun, or vsim (questa: vlib/vlog are taken from vsim's directory)
#   solver:    Verilator only: command line put in VERILATOR_SOLVER (its first word must exist)
#   sampler:   Verilator only: default | solver | null (null: no sampler plusarg; stock Verilator)
#   version:   optional; text that must appear in the tool's version output (test fails otherwise);
#              flag: verilator --version, vcs -ID, xrun -version, vsim -version
#   plusargs:  extra plusargs for every run
#   build_args: extra compile/elaborate arguments (e.g. vcs ["-cm", "line"])
#   env:       extra environment for every run
#   replay:    optional, Verilator only; bench_vlt_replay executable. The Verilator run then only
#              captures the solver session (+verilator+solver+file+), and the
#              timing comes from replaying that session through dv-solve
#              in-process (no Verilator, no pipe); see standalone.py.
#   replay_pass: the bench_vlt_replay pass to time (default api-cache), reported per
#              randomize() call without the warm-up calls
#   replay_cmd:  instead of `replay`, run `<replay_cmd> session.cmds.smt2` (one process, text
#                SMT-LIB) replay_reps times (default 1); best wall time / calls is reported.
configs:
  # Primary (A): dev Verilator, z3 via SMT-LIB pipe, Verilator's own sampler.
  - id: vlt-z3-default
    simulator: verilator
    tool: ${SIMBENCH_VERILATOR_SC:-~/projects/verilator/verilator-sampler-control/bin/verilator}
    version: "5.053 devel"
    solver: z3 --in
    sampler: default

  # Primary (B): dev Verilator, dv-solve-smt2, dv-solve does the sampling.
  # No mode flag: dv-solve-smt2 routes seeded (sampling) sessions itself.
  - id: vlt-dvs-solver
    simulator: verilator
    tool: ${SIMBENCH_VERILATOR_SC:-~/projects/verilator/verilator-sampler-control/bin/verilator}
    version: "5.053 devel"
    solver: ${SIMBENCH_DVS_SMT2:-~/projects/verilator/verilator-sampler-control/dv-solve/build/dv-solve-smt2}
    sampler: solver

  # Primary (C): dv-solve alone on the same constraints. B's session (same
  # n/seed, solver sampler) is captured, then replayed through the dv-solve
  # builder API with compiled contexts reused; Verilator is not timed.
  - id: dvs-standalone
    simulator: verilator
    tool: ${SIMBENCH_VERILATOR_SC:-~/projects/verilator/verilator-sampler-control/bin/verilator}
    version: "5.053 devel"
    solver: ${SIMBENCH_DVS_SMT2:-~/projects/verilator/verilator-sampler-control/dv-solve/build/dv-solve-smt2}
    sampler: solver
    replay: ${SIMBENCH_DVS_REPLAY:-~/projects/verilator/verilator-sampler-control/dv-solve/build/bench_vlt_replay}

  # Standalone text replays of the same captured session (B's, dv-solve sampler):
  # one solver process reads the whole session file; wall time / calls.
  - id: z3-standalone
    simulator: verilator
    tool: ${SIMBENCH_VERILATOR_SC:-~/projects/verilator/verilator-sampler-control/bin/verilator}
    version: "5.053 devel"
    solver: ${SIMBENCH_DVS_SMT2:-~/projects/verilator/verilator-sampler-control/dv-solve/build/dv-solve-smt2}
    sampler: solver
    replay_cmd: z3 -smt2

  - id: dvs-smt2-standalone
    simulator: verilator
    tool: ${SIMBENCH_VERILATOR_SC:-~/projects/verilator/verilator-sampler-control/bin/verilator}
    version: "5.053 devel"
    solver: ${SIMBENCH_DVS_SMT2:-~/projects/verilator/verilator-sampler-control/dv-solve/build/dv-solve-smt2}
    sampler: solver
    replay_cmd: ${SIMBENCH_DVS_SMT2:-~/projects/verilator/verilator-sampler-control/dv-solve/build/dv-solve-smt2}

  # Secondary: dev Verilator, dv-solve-smt2 as a plain SMT solver, Verilator sampler.
  - id: vlt-dvs-default
    simulator: verilator
    tool: ${SIMBENCH_VERILATOR_SC:-~/projects/verilator/verilator-sampler-control/bin/verilator}
    version: "5.053 devel"
    solver: ${SIMBENCH_DVS_SMT2:-~/projects/verilator/verilator-sampler-control/dv-solve/build/dv-solve-smt2}
    sampler: default

  # Secondary: stock Verilator on PATH with z3 (no sampler control).
  - id: vlt540-z3
    simulator: verilator
    tool: ${SIMBENCH_VERILATOR:-verilator}
    solver: z3 --in
    sampler: null

  # Other simulators: unavailable (skipped) unless the tool is on PATH or the
  # SIMBENCH_* variable names it. They use their built-in solver and sampler.
  - id: vcs
    simulator: vcs
    tool: ${SIMBENCH_VCS:-vcs}

  - id: xcelium
    simulator: xcelium
    tool: ${SIMBENCH_XRUN:-xrun}

  - id: questa
    simulator: questa
    tool: ${SIMBENCH_VSIM:-vsim}
