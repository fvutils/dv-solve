# Docs build for fvutils/dv-solve on Forgejo Actions.
#
# THIS IS THE ONLY THING THAT PUBLISHES THESE DOCS. dvkit.org owns all
# documentation: a repo's docs land at dvkit.org/<org>/<repo>/. dvkit.org is a
# single Cloudflare Pages project and a deploy replaces the WHOLE site, so
# there is exactly one publisher for it, and it is host-side:
#
#   docs-fetch fvutils/dv-solve main   # artifact -> staging/
#   docs-promote / docs-deploy         # -> dvkit.org/fvutils/dv-solve/
#
# The built HTML leaves as an ARTIFACT and nothing else. This job holds no
# Cloudflare token and mounts nothing: a workflow file is public and editable
# by anyone who can push, and the deploy credential is account-scoped.
#
# Pushes to main are promoted automatically, so there is no review gate in
# front of the published site. The build and sanity-check steps below are what
# stand in for one.
#
# NO RELEASE-AUTHORITY GATE, deliberately. That switch decides who publishes
# PACKAGES. Docs are not a release -- they publish from Forgejo to dvkit.org
# whichever forge holds release authority.
#
# Constraints this file is shaped by, all measured on this instance:
#
#  1. No third-party actions. A bare `uses:` resolves against code.forgejo.org,
#     not github.com, so actions/setup-python does not exist here.
#     `ubuntu-latest` maps to catthehacker/ubuntu:act-22.04, which carries
#     Python 3.10 -- enough for Sphinx 7.
#  2. `python` unqualified DOES NOT EXIST in that image. Use python3.
#  3. The artifact name is the `docs-<org>-<repo>` convention docs-fetch
#     matches on, and `path: .../**` makes the build directory the ZIP ROOT --
#     docs-fetch refuses an artifact with no index.html at the top level.
#
# The site's source is docs/site/ only. The working notes elsewhere in docs/
# are outside the Sphinx source tree and are never published.

name: Docs

# The 06:30 schedule re-renders the Results pages after the nightly perf run
# (05:00, perf.yml), so they lag main by at most about a day.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *'

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check for internal identifiers in tracked files
        # This repo is published to git.dvkit.org and mirrored to GitHub, so
        # anything committed here is public. Internal host names, tailnet
        # addresses and CGNAT-range IPs must not appear in tracked files -- if a
        # build ever needs one, it belongs in a repository secret, which is
        # masked in logs.
        run: |
          pattern='perch-char\.ts\.net|\.ts\.net|a9550|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]+\.[0-9]+'
          if git grep -nIE "$pattern" -- . ':!.forgejo/workflows/' ; then
            echo "::error::internal identifier found in a tracked file (see matches above)"
            exit 1
          fi
          echo "OK: no internal identifiers in tracked files"

      - name: Install doc dependencies
        # --break-system-packages is a FALLBACK, not the first attempt. Some
        # rebuilds of catthehacker/ubuntu:act-22.04 mark the interpreter
        # externally-managed (PEP 668). There is nothing to protect here -- the
        # container is discarded at the end of the job.
        run: |
          pip_install() {
            python3 -m pip install -q "$@" && return 0
            python3 -m pip install -q --break-system-packages "$@"
          }
          pip_install --upgrade pip
          pip_install -r docs/site/requirements.txt

      - name: Fetch perf run records
        # The Results pages (docs/site/results/) are rendered from the
        # committed history plus the perf-* artifacts not yet consolidated
        # (tests/perf/history.py). FAIL CLOSED: a build without them would
        # deploy pages showing nothing, or quietly older numbers. Pull
        # requests render from the committed history alone and are never
        # published.
        if: github.event_name != 'pull_request'
        env:
          FORGEJO_API_URL: ${{ github.server_url }}/api/v1
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m tests.perf.history fetch --out perf-records --latest
          python3 -m tests.perf.history status --warn-after 60

      - name: Render the Results pages
        # --max-age-days: once SAT results exist, results older than 10 days
        # mean the nightly perf job has stopped; fail rather than publish
        # stale numbers as current.
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            python3 -m tests.perf.render
          else
            python3 -m tests.perf.render --records perf-records --max-age-days 10
          fi

      - name: Build HTML docs
        # -W: a broken cross-reference or a failed autodoc import fails the
        # build instead of shipping a page with a hole in it. --keep-going
        # reports every warning, not just the first.
        run: python3 -m sphinx -M html docs/site docs/site/_build -W --keep-going

      - name: Sanity-check the build
        # Sphinx exits 0 on a build that produced almost nothing, and an empty
        # doc set is worse than a failed one because it deploys.
        run: |
          out=docs/site/_build/html
          test -s "$out/index.html" \
            || { echo "::error::no index.html in the build output"; exit 1; }
          n=$(find "$out" -name '*.html' | wc -l)
          echo "generated pages: $n"
          # A local build produced 27 pages on 2026-10-02 (with Results). The
          # floor is set well BELOW that: it catches a COLLAPSED build, not a
          # deleted page. Raise it as the site grows.
          [ "$n" -ge 20 ] || { echo "::error::only $n pages built; refusing to call this a doc set."; exit 1; }
          for p in results/index results/sat results/randomization results/methodology; do
            test -s "$out/$p.html" || { echo "::error::results page $p.html missing"; exit 1; }
          done
          # The generated site is public too: make sure no internal identifier
          # reached it through generated content.
          pattern='perch-char\.ts\.net|\.ts\.net|a9550|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]+\.[0-9]+'
          if grep -rnIE "$pattern" "$out" ; then
            echo "::error::internal identifier found in the built site"
            exit 1
          fi

      - name: Upload docs
        # Consumed by the host-side poller: docs-fetch fvutils/dv-solve main
        uses: forgejo/upload-artifact@v4
        with:
          name: docs-fvutils-dv-solve
          path: docs/site/_build/html/**
          if-no-files-found: error
