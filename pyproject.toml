[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dv-solve"
version = "0.0.1"
description = "Domain-agnostic CLP(FD) constraint solver"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "Apache-2.0"}
authors = [{name = "Matthew Ballance", email = "matt.ballance@gmail.com"}]
dependencies = []

[project.optional-dependencies]
zuspec = [
    "zuspec-dataclasses",
    "zuspec-ir-core",
    "zuspec-be-sv",
]
dev = [
    "dv-solve[zuspec]",
    "pytest>=6.0",
    "dv-flow-mgr",
    "dv-flow-libhdlsim",
]

[tool.setuptools]
packages = ["dv_solve"]
package-dir = {"" = "src"}
