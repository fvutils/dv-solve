package:
  name: dv-solve
  default-dep-set: dev

  dep-sets:
  - name: use
    deps:
    - name: cadical
      url: https://github.com/arminbiere/cadical.git
      tag: rel-3.0.0
  - name: dev
    deps:
    - name: zuspec-dataclasses
      url: https://github.com/zuspec/zuspec-dataclasses.git
      dep-set: default-dev
    - name: zuspec-be-fv
      url: https://github.com/zuspec/zuspec-be-fv.git
      dep-set: default-dev
    - name: zuspec-be-sv
      url: https://github.com/zuspec/zuspec-be-sv.git
      dep-set: default-dev
    - name: zuspec-synth
      url: https://github.com/zuspec/zuspec-synth.git
      dep-set: default-dev
    - name: pytest-dfm
      url: https://github.com/dv-flow/pytest-dfm.git
      dep-set: default-dev
    - name: dv-flow-libhdlsim
      url: https://github.com/dv-flow/dv-flow-libhdlsim.git
      dep-set: default-dev
    - name: yosys
      url: https://github.com/edapack/yosys-bin
      src: gh-rls
      dep-set: default
    - name: verilator
      url: https://github.com/edapack/verilator-bin
      src: gh-rls
    - name: covsight
      url: https://github.com/covsight/covsight.git
      dep-set: default-dev
    - name: scipy
      src: pypi
    # Build-time requirements. pyproject.toml declares these under
    # build-system.requires / get_requires_for_build_wheel, but ivpm installs
    # with --no-build-isolation, so PEP 517 never provisions them -- they have
    # to be in the venv before the editable install of dv-solve runs.
    #   ivpm-build: the PEP 517 backend itself (build-backend = ivpm_build.backend)
    #   ninja:      the generator CmakeBuilder defaults to (CMAKE_BUILD_TOOL)
    - name: ivpm-build
      src: pypi
      version: ">=0.2.0.27908268978"
    - name: ninja
      src: pypi


